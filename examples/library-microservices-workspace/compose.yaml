services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: library
      POSTGRES_USER: library
    ports:
      - '5432:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
