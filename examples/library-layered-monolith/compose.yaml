services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: library
      POSTGRES_PASSWORD: library
      POSTGRES_USER: library
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U library -d library']
      interval: 5s
      timeout: 5s
      retries: 12
